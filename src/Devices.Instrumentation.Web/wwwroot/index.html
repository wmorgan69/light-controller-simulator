<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title data-i18n="documentTitle">Lighting Instrumentation</title>
  <link rel="stylesheet" href="/styles.css?v=room-names-2">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Lighting instrumentation home" data-i18n-aria-label="brandLabel">
      <span class="brand-mark" aria-hidden="true">L</span>
      <span class="brand-copy"><span class="brand-parent"><span data-i18n="brandParent">Building systems</span> <span class="brand-divider">/</span></span> <span data-i18n="brandName">Lighting</span></span>
    </a>
    <p id="connectionStatus" class="connection-status" role="status">
      <span class="status-dot" aria-hidden="true"></span>
      <span id="connectionStatusText" data-i18n="connectionWaiting">Waiting for telemetry</span>
    </p>
  </header>
  <main>
    <section class="page-heading" aria-labelledby="pageTitle">
      <div>
        <p class="eyebrow" data-i18n="liveMonitoring">LIVE MONITORING</p>
        <h1 id="pageTitle" data-i18n="pageTitle">Lighting overview</h1>
        <p class="page-intro" data-i18n="pageIntro">Controller health, room occupancy and lighting activity across the building.</p>
      </div>
      <p class="updated-label"><span class="live-pulse" aria-hidden="true"></span> <span data-i18n="updatesAutomatically">Updates automatically</span></p>
    </section>

    <section id="summaryCards" class="summary-grid" aria-label="Building summary" data-i18n-aria-label="buildingSummary"></section>

    <div class="dashboard-grid">
      <div class="primary-column">
        <section class="panel activity-panel" aria-labelledby="activityTitle">
          <div class="section-heading">
            <div>
              <p class="eyebrow" data-i18n="buildingTotal">BUILDING TOTAL</p>
              <h2 id="activityTitle" data-i18n="activityTitle">Lighting activity</h2>
            </div>
            <p id="activityCaption" class="muted-caption"></p>
          </div>
          <div id="lightingSummary"></div>
        </section>

        <section class="controllers-section" aria-labelledby="controllersTitle">
          <div class="section-heading controllers-heading">
            <div>
              <p class="eyebrow" data-i18n="floorByFloor">FLOOR BY FLOOR</p>
              <h2 id="controllersTitle" data-i18n="controllersTitle">Controllers</h2>
            </div>
            <span id="controllerCount" class="section-count"></span>
          </div>
          <div id="controllers" class="controller-grid"></div>
        </section>
      </div>

      <aside class="panel events-panel" aria-labelledby="eventsTitle">
        <div class="section-heading">
          <div>
            <p class="eyebrow" data-i18n="systemActivity">SYSTEM ACTIVITY</p>
            <h2 id="eventsTitle" data-i18n="eventsTitle">Recent events</h2>
          </div>
          <span id="eventCount" class="section-count"></span>
        </div>
        <div id="events" class="event-list"></div>
      </aside>
    </div>
  </main>
  <script type="module" src="/app.js?v=localization-en-1"></script>
</body>
</html>
