<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="title description">
  <title id="title">Controller state and offline semantics</title>
  <desc id="description">An observed controller is healthy when it has no faults, faulted when it has an active fault, or offline after the stale observation timeout. New telemetry returns an offline controller to observed.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#60A5FA"/>
    </marker>
    <style>
      .node, .caption { fill: #1E293B; }
      .node { stroke: #60A5FA; stroke-width: 2; }
      .label { fill: #F8FAFC; font: 16px "Segoe UI", Arial, sans-serif; text-anchor: middle; }
      .edge-label { fill: #F8FAFC; font: 14px "Segoe UI", Arial, sans-serif; text-anchor: middle; }
      .edge { fill: none; stroke: #60A5FA; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <g class="edge">
    <path d="M500 38 L500 76"/>
    <path d="M410 125 L190 245"/>
    <path d="M500 132 L500 245"/>
    <path d="M590 125 L790 245"/>
    <path d="M820 245 L920 195 L920 104 L600 104"/>
  </g>
  <circle cx="500" cy="27" r="10" fill="#60A5FA"/>
  <g class="node">
    <rect x="400" y="76" width="200" height="56" rx="8"/>
    <rect x="90" y="245" width="200" height="56" rx="8"/>
    <rect x="400" y="245" width="200" height="56" rx="8"/>
    <rect x="690" y="245" width="200" height="56" rx="8"/>
  </g>
  <g class="label">
    <text x="500" y="110">Observed</text>
    <text x="190" y="279">Healthy</text>
    <text x="500" y="279">Faulted</text>
    <text x="790" y="279">Offline</text>
  </g>
  <g class="caption">
    <rect x="240" y="167" width="80" height="23" rx="3"/>
    <rect x="450" y="177" width="100" height="23" rx="3"/>
    <rect x="600" y="167" width="195" height="23" rx="3"/>
    <rect x="680" y="91" width="160" height="23" rx="3"/>
  </g>
  <g class="edge-label">
    <text x="280" y="183">no faults</text>
    <text x="500" y="193">active fault</text>
    <text x="697" y="183">stale observation timeout</text>
    <text x="760" y="107">new telemetry arrives</text>
  </g>
</svg>
