<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 150" role="img" aria-labelledby="title description">
  <title id="title">Room to stair access</title>
  <desc id="description">A room connects through an open doorway and rear walkway to a stair landing and the adjacent floor.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#60A5FA"/>
    </marker>
    <style>
      .node { fill: #1E293B; stroke: #60A5FA; stroke-width: 2; }
      .edge { fill: none; stroke: #60A5FA; stroke-width: 2; marker-end: url(#arrow); }
      .label { fill: #F8FAFC; font: 16px "Segoe UI", Arial, sans-serif; text-anchor: middle; }
    </style>
  </defs>
  <rect width="920" height="150" rx="12" fill="#0F172A"/>
  <g class="edge">
    <path d="M155 75 H195"/>
    <path d="M345 75 H385"/>
    <path d="M535 75 H575"/>
    <path d="M725 75 H765"/>
  </g>
  <g class="node">
    <rect x="5" y="45" width="150" height="60" rx="8"/>
    <rect x="195" y="45" width="150" height="60" rx="8"/>
    <rect x="385" y="45" width="150" height="60" rx="8"/>
    <rect x="575" y="45" width="150" height="60" rx="8"/>
    <rect x="765" y="45" width="150" height="60" rx="8"/>
  </g>
  <g class="label">
    <text x="80" y="81">Room</text>
    <text x="270" y="81">Open doorway</text>
    <text x="460" y="81">Rear walkway</text>
    <text x="650" y="81">Stair landing</text>
    <text x="840" y="81">Adjacent floor</text>
  </g>
</svg>
