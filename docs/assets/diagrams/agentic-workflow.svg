<svg viewBox="0 0 1300 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Define styles -->
  <defs>
    <style>
      .stage { fill: #1E293B; stroke: #60A5FA; stroke-width: 2; }
      .decision { fill: #0F766E; stroke: #14B8A6; stroke-width: 2; }
      .outcome { fill: #065F46; stroke: #10B981; stroke-width: 2; }
      .label { fill: #F8FAFC; font-family: Arial, sans-serif; font-size: 15px; font-weight: bold; text-anchor: middle; dominant-baseline: middle; }
      .arrow { stroke: #60A5FA; stroke-width: 2; fill: none; }
      .arrowtext { fill: #60A5FA; font-family: Arial, sans-serif; font-size: 12px; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#60A5FA"/>
    </marker>
  </defs>

  <!-- TOP LINE: Plan -> Implement -> Build -> Code Review -->
  
  <!-- Plan -->
  <rect class="stage" x="10" y="30" width="90" height="60" rx="5"/>
  <text class="label" x="55" y="60">Plan</text>
  
  <!-- Arrow 1 -->
  <path class="arrow" d="M 100 60 L 125 60" marker-end="url(#arrowhead)"/>
  
  <!-- Implement -->
  <rect class="stage" x="125" y="30" width="90" height="60" rx="5"/>
  <text class="label" x="170" y="60">Implement</text>
  
  <!-- Arrow 2 -->
  <path class="arrow" d="M 215 60 L 240 60" marker-end="url(#arrowhead)"/>
  
  <!-- Build -->
  <rect class="stage" x="240" y="30" width="90" height="60" rx="5"/>
  <text class="label" x="285" y="60">Build</text>
  
  <!-- Arrow 3 -->
  <path class="arrow" d="M 330 60 L 355 60" marker-end="url(#arrowhead)"/>
  
  <!-- Code Review -->
  <rect class="stage" x="355" y="30" width="100" height="60" rx="5"/>
  <text class="label" x="405" y="50">Code</text>
  <text class="label" x="405" y="65">Review</text>
  
  <!-- Arrow down to Security -->
  <path class="arrow" d="M 405 90 L 405 130" marker-end="url(#arrowhead)"/>
  
  <!-- BOTTOM LINE: Security? -> UX? -> Merge -->
  
  <!-- Security-sensitive? diamond -->
  <polygon class="decision" points="405,170 450,210 405,250 360,210"/>
  <text class="label" x="405" y="205">Security</text>
  <text class="label" x="405" y="223">?</text>
  
  <!-- Arrow YES to Security Review (left) -->
  <path class="arrow" d="M 360 210 L 240 210" marker-end="url(#arrowhead)"/>
  <text class="arrowtext" x="295" y="205">Yes</text>
  
  <!-- Security Review -->
  <rect class="stage" x="140" y="180" width="100" height="60" rx="5"/>
  <text class="label" x="190" y="200">Security</text>
  <text class="label" x="190" y="218">Review</text>
  
  <!-- Arrow from Security Review back to UI? -->
  <path class="arrow" d="M 240 210 L 360 210" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow NO to UI changes? (right) -->
  <path class="arrow" d="M 450 210 L 540 210" marker-end="url(#arrowhead)"/>
  <text class="arrowtext" x="490" y="205">No</text>
  
  <!-- UI changes? diamond -->
  <polygon class="decision" points="600,170 645,210 600,250 555,210"/>
  <text class="label" x="600" y="205">UI</text>
  <text class="label" x="600" y="223">?</text>
  
  <!-- Arrow YES to UX Review (top) -->
  <path class="arrow" d="M 645 190 L 745 110" marker-end="url(#arrowhead)"/>
  <text class="arrowtext" x="680" y="140">Yes</text>
  
  <!-- UX Review (top line) -->
  <rect class="stage" x="745" y="80" width="80" height="60" rx="5"/>
  <text class="label" x="785" y="100">UX</text>
  <text class="label" x="785" y="118">Review</text>
  
  <!-- Arrow from UX to Merge -->
  <path class="arrow" d="M 825 110 L 950 110 L 950 210 L 1050 210" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow NO to Merge (right) -->
  <path class="arrow" d="M 645 230 L 1050 230" marker-end="url(#arrowhead)"/>
  <text class="arrowtext" x="840" y="250">No</text>
  
  <!-- Merge (outcome) -->
  <rect class="outcome" x="1050" y="180" width="90" height="60" rx="5"/>
  <text class="label" x="1095" y="210">Merge</text>
</svg>
