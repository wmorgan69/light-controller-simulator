<svg viewBox="0 0 780 1010" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Agentic build-review-rebuild workflow</title>
  <desc id="description">Plan, implement and validate, then complete code review and applicable security and UX reviews. Actionable findings, requested changes or failed checks return to implementation, validation and affected reviews. Required reviews that cannot be completed are reported as limitations, not passes. Human approval and required checks precede merge.</desc>
  <defs>
    <style>
      .stage { fill: #1E293B; stroke: #60A5FA; stroke-width: 2; }
      .decision { fill: #0F766E; stroke: #14B8A6; stroke-width: 2; }
      .outcome { fill: #065F46; stroke: #10B981; stroke-width: 2; }
      .label { fill: #F8FAFC; font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .arrow { stroke: #60A5FA; stroke-width: 2; fill: none; }
      .feedback { stroke: #FBBF24; stroke-width: 2; fill: none; }
      .arrowtext { fill: #F8FAFC; font-family: Arial, sans-serif; font-size: 14px; }
      .note { fill: #F8FAFC; font-family: Arial, sans-serif; font-size: 14px; text-anchor: middle; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#60A5FA"/>
    </marker>
    <marker id="feedback-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#FBBF24"/>
    </marker>
  </defs>

  <rect width="780" height="1010" fill="#0F172A"/>

  <rect class="stage" x="300" y="24" width="220" height="50" rx="5"/>
  <text class="label" x="410" y="55">Plan</text>
  <path class="arrow" d="M 410 74 V 104" marker-end="url(#arrowhead)"/>

  <rect class="stage" x="300" y="104" width="220" height="50" rx="5"/>
  <text class="label" x="410" y="135">Implement / fix</text>
  <path class="arrow" d="M 410 154 V 184" marker-end="url(#arrowhead)"/>

  <rect class="stage" x="300" y="184" width="220" height="50" rx="5"/>
  <text class="label" x="410" y="215">Build and test</text>
  <path class="arrow" d="M 410 234 V 264" marker-end="url(#arrowhead)"/>

  <rect class="stage" x="300" y="264" width="220" height="50" rx="5"/>
  <text class="label" x="410" y="295">Code review</text>
  <path class="arrow" d="M 410 314 V 344" marker-end="url(#arrowhead)"/>

  <polygon class="decision" points="410,344 470,384 410,424 350,384"/>
  <text class="label" x="410" y="380">Security</text>
  <text class="label" x="410" y="399">needed?</text>
  <path class="arrow" d="M 410 424 V 464" marker-end="url(#arrowhead)"/>
  <text class="arrowtext" x="420" y="449">Yes</text>
  <path class="arrow" d="M 470 384 H 650 V 534 H 410 V 544" marker-end="url(#arrowhead)"/>
  <text class="arrowtext" x="560" y="376">No / skip</text>

  <rect class="stage" x="300" y="464" width="220" height="50" rx="5"/>
  <text class="label" x="410" y="495">Security review</text>
  <path class="arrow" d="M 410 514 V 544" marker-end="url(#arrowhead)"/>

  <polygon class="decision" points="410,544 470,584 410,624 350,584"/>
  <text class="label" x="410" y="580">UX review</text>
  <text class="label" x="410" y="599">needed?</text>
  <path class="arrow" d="M 410 624 V 664" marker-end="url(#arrowhead)"/>
  <text class="arrowtext" x="420" y="649">Yes</text>
  <path class="arrow" d="M 470 584 H 650 V 734 H 410 V 764" marker-end="url(#arrowhead)"/>
  <text class="arrowtext" x="560" y="576">No / skip</text>

  <rect class="stage" x="300" y="664" width="220" height="50" rx="5"/>
  <text class="label" x="410" y="695">UX review</text>
  <path class="arrow" d="M 410 714 V 764" marker-end="url(#arrowhead)"/>

  <rect class="stage" x="300" y="764" width="220" height="60" rx="5"/>
  <text class="label" x="410" y="788">Human decision</text>
  <text class="label" x="410" y="808">and required CI checks</text>
  <path class="arrow" d="M 410 824 V 854" marker-end="url(#arrowhead)"/>
  <text class="arrowtext" x="425" y="844">Approved; checks pass</text>

  <rect class="outcome" x="300" y="854" width="220" height="50" rx="5"/>
  <text class="label" x="410" y="885">Merge</text>

  <path class="feedback" d="M 300 209 H 100 M 300 289 H 100 M 300 489 H 100 M 300 689 H 100 M 300 794 H 100 M 100 794 V 129 H 300" marker-end="url(#feedback-arrowhead)"/>
  <text class="arrowtext" x="110" y="180">Build/test failure or</text>
  <text class="arrowtext" x="110" y="198">actionable finding</text>
  <text class="arrowtext" x="110" y="745">Fix, revalidate and</text>
  <text class="arrowtext" x="110" y="764">repeat affected reviews</text>
  <text class="arrowtext" x="110" y="785">Changes requested / CI fails</text>

  <text class="note" x="390" y="950">Forward from a review means it is complete; skipped reviews are not passes.</text>
  <text class="note" x="390" y="975">If a required review cannot be completed, report the limitation; do not mark it passed.</text>
</svg>
