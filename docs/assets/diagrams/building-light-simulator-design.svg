<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 490" role="img" aria-labelledby="title description">
  <title id="title">Building Light Simulator design flow</title>
  <desc id="description">The browser UI calls HTTP endpoints, which update BuildingSimulator and ControllerState. Current state returns over HTTP and is published through optional MQTT to the instrumentation subscriber.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#60A5FA"/>
    </marker>
    <style>
      .node { fill: #1E293B; stroke: #60A5FA; stroke-width: 2; }
      .label { fill: #F8FAFC; font: 16px "Segoe UI", Arial, sans-serif; text-anchor: middle; }
      .edge { fill: none; stroke: #60A5FA; stroke-width: 2; marker-end: url(#arrow); }
      .edge-label { fill: #F8FAFC; font: 14px "Segoe UI", Arial, sans-serif; text-anchor: middle; }
    </style>
  </defs>
  <g class="edge">
    <path d="M425 74 L425 112"/>
    <path d="M425 174 L425 212"/>
    <path d="M425 274 L425 312"/>
    <path d="M300 343 L140 343 L140 410"/>
    <path d="M260 343 L240 343 L240 143 L300 143"/>
    <path d="M260 437 L300 437"/>
    <path d="M500 437 L560 437"/>
  </g>
  <g class="node">
    <rect x="300" y="20" width="250" height="54" rx="8"/>
    <rect x="300" y="120" width="250" height="54" rx="8"/>
    <rect x="300" y="220" width="250" height="54" rx="8"/>
    <rect x="300" y="320" width="250" height="54" rx="8"/>
    <rect x="20" y="410" width="240" height="54" rx="8"/>
    <rect x="300" y="410" width="200" height="54" rx="8"/>
    <rect x="560" y="410" width="270" height="54" rx="8"/>
  </g>
  <g class="label">
    <text x="425" y="52">3D and accessible browser UI</text>
    <text x="425" y="152">ASP.NET HTTP endpoints</text>
    <text x="425" y="252">BuildingSimulator</text>
    <text x="425" y="352">ControllerState dictionary</text>
    <text x="140" y="442">MqttTelemetryPublisher</text>
    <text x="400" y="442">Optional MQTT broker</text>
    <text x="695" y="442">Instrumentation subscriber</text>
  </g>
  <text class="edge-label" x="226" y="253" transform="rotate(-90 226 253)">current state response</text>
</svg>
