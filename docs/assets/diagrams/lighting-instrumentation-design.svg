<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" role="img" aria-labelledby="title description">
  <title id="title">Lighting Instrumentation design</title>
  <desc id="description">MQTT subscriber and simulator HTTP fallback feed TelemetryStore. The store feeds building summary cards, lighting activity, floor controller cards, the recent-event timeline and SQLite. Latest controller states feed the first three views, and recent device events feed the timeline.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#60A5FA"/>
    </marker>
    <style>
      .node { fill: #1E293B; stroke: #60A5FA; stroke-width: 2; }
      .label { fill: #F8FAFC; font: 16px "Segoe UI", Arial, sans-serif; text-anchor: middle; }
      .edge { fill: none; stroke: #60A5FA; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <g class="edge">
    <path d="M250 183 L345 253"/>
    <path d="M250 263 L345 267"/>
