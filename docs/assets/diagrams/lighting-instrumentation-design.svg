    <path d="M515 283 L660 464"/>
    <path d="M250 63 L660 55"/>
    <path d="M250 72 L580 72 L580 155 L660 155"/>
    <path d="M250 81 L565 81 L565 255 L660 255"/>
    <path d="M250 463 L570 463 L570 355 L660 355"/>
  </g>
  <g class="node">
    <rect x="30" y="35" width="220" height="56" rx="8"/>
    <rect x="30" y="155" width="220" height="56" rx="8"/>
    <rect x="30" y="235" width="220" height="56" rx="8"/>
    <rect x="30" y="435" width="220" height="56" rx="8"/>
    <rect x="345" y="235" width="170" height="56" rx="8"/>
    <rect x="660" y="35" width="260" height="56" rx="8"/>
    <rect x="660" y="135" width="260" height="56" rx="8"/>
    <rect x="660" y="235" width="260" height="56" rx="8"/>
    <rect x="660" y="335" width="260" height="56" rx="8"/>
    <rect x="660" y="435" width="260" height="56" rx="8"/>
  </g>
  <g class="label">
    <text x="140" y="69">Latest controller states</text>
    <text x="140" y="189">MQTT subscriber</text>
