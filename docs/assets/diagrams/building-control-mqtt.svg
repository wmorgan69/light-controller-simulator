<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 570" role="img" aria-labelledby="title description">
  <title id="title">MQTT command and telemetry flow</title>
  <desc id="description">A DeviceCommand is sent to the controller commands topic and handled by the command handler. The resulting state mutation produces an acknowledgement on the command acknowledgement topic and state on the controller telemetry topic.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#60A5FA"/>
    </marker>
    <style>
      .node { fill: #1E293B; stroke: #60A5FA; stroke-width: 2; }
      .label { fill: #F8FAFC; font: 16px "Segoe UI", Arial, sans-serif; text-anchor: middle; }
      .topic { fill: #F8FAFC; font: 14px Consolas, monospace; text-anchor: middle; }
      .edge { fill: none; stroke: #60A5FA; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <g class="edge">
    <path d="M475 78 L475 115"/>
    <path d="M475 175 L475 215"/>
    <path d="M475 275 L475 315"/>
    <path d="M425 375 L245 430"/>
    <path d="M525 375 L705 430"/>
  </g>
  <g class="node">
    <rect x="375" y="22" width="200" height="56" rx="8"/>
    <rect x="195" y="115" width="560" height="60" rx="8"/>
    <rect x="365" y="215" width="220" height="60" rx="8"/>
    <rect x="365" y="315" width="220" height="60" rx="8"/>
    <rect x="20" y="430" width="430" height="82" rx="8"/>
    <rect x="500" y="430" width="430" height="82" rx="8"/>
  </g>
  <g class="label">
    <text x="475" y="56">DeviceCommand</text>
    <text x="475" y="250">Command handler</text>
    <text x="475" y="350">Build state mutation</text>
  </g>
  <g class="topic">
    <text x="475" y="150">building/controllers/{controllerId}/commands</text>
    <text x="235" y="458"><tspan x="235">building/controllers/{controllerId}/</tspan><tspan x="235" dy="20">commands/{commandId}/ack</tspan></text>
    <text x="715" y="458"><tspan x="715">building/controllers/{controllerId}/</tspan><tspan x="715" dy="20">telemetry</tspan></text>
  </g>
</svg>
