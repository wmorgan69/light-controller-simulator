<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" role="img" aria-labelledby="title description">
  <title id="title">Architecture and communication</title>
  <desc id="description">A browser user accesses Building Control, whose in-process simulated device connector maintains authoritative simulated state. State flows through the HTTP API and poller as well as through the MQTT publisher, optional broker and telemetry subscriber. Both feed the telemetry store, which serves the instrumentation dashboard.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#60A5FA"/>
    </marker>
    <style>
      .node { fill: #1E293B; stroke: #60A5FA; stroke-width: 2; }
      .label { fill: #F8FAFC; font: 15px "Segoe UI", Arial, sans-serif; text-anchor: middle; }
      .edge { fill: none; stroke: #60A5FA; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <g class="edge">
    <path d="M155 225 L190 225"/>
    <path d="M345 225 L380 225"/>
    <path d="M540 210 L575 110"/>
    <path d="M700 140 L700 310"/>
    <path d="M730 110 L770 110"/>
    <path d="M730 340 L770 340"/>
    <path d="M910 110 L935 110 L935 180"/>
    <path d="M1010 230 L1040 230"/>
    <path d="M910 340 L1015 340"/>
    <path d="M1097 370 L1097 410 L937 410 L937 280"/>
  </g>
  <g class="node">
    <rect x="20" y="195" width="135" height="60" rx="8"/>
    <rect x="190" y="195" width="155" height="60" rx="8"/>
    <rect x="380" y="195" width="160" height="60" rx="8"/>
    <rect x="575" y="80" width="155" height="60" rx="8"/>
    <rect x="575" y="310" width="155" height="60" rx="8"/>
    <rect x="770" y="80" width="140" height="60" rx="8"/>
    <rect x="770" y="310" width="140" height="60" rx="8"/>
    <rect x="865" y="180" width="145" height="100" rx="8"/>
    <rect x="1040" y="195" width="145" height="70" rx="8"/>
  </g>
  <g class="label">
    <text x="87" y="231">Browser user</text>
    <text x="267" y="221"><tspan x="267">Building Control</tspan><tspan x="267" dy="20">web app</tspan></text>
    <text x="460" y="221"><tspan x="460">Authoritative</tspan><tspan x="460" dy="20">device state</tspan></text>
    <text x="652" y="116">HTTP API</text>
    <text x="652" y="346">MQTT publisher</text>
    <text x="840" y="106"><tspan x="840">Dashboard</tspan><tspan x="840" dy="20">HTTP poller</tspan></text>
    <text x="840" y="336"><tspan x="840">Optional MQTT</tspan><tspan x="840" dy="20">broker</tspan></text>
    <text x="937" y="226"><tspan x="937">Telemetry</tspan><tspan x="937" dy="20">store</tspan></text>
    <text x="1112" y="225"><tspan x="1112">Instrumentation</tspan><tspan x="1112" dy="20">dashboard</tspan></text>
  </g>
  <rect class="node" x="1015" y="310" width="165" height="60" rx="8"/>
  <text class="label" x="1097" y="336"><tspan x="1097">Telemetry</tspan><tspan x="1097" dy="20">subscriber</tspan></text>
</svg>
