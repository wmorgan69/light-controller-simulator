<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 1040" role="img" aria-labelledby="title description">
  <title id="title">Proposed Azure production architecture</title>
  <desc id="description">Internet users reach an Azure Application Gateway with WAF. It routes to the building configurator and instrumentation in an internal Azure Container Apps environment. Instrumentation polls the configurator privately. Both applications access Azure Database for PostgreSQL Flexible Server using private networking. The configurator and physical devices exchange messages through Azure IoT Hub. Integration and scaling require application changes.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 Z" fill="#60A5FA"/></marker>
    <style>
      .bg { fill:#0F172A } .boundary { fill:#111F33; stroke:#60A5FA; stroke-width:2 }
      .tier { fill:#17263B; stroke:#547599; stroke-width:1.5 }
      .node { fill:#1E293B; stroke:#60A5FA; stroke-width:2 }
      .line { fill:none; stroke:#60A5FA; stroke-width:2.5; marker-end:url(#arrow) }
      .dash { stroke-dasharray:7 5 } text { fill:#F8FAFC; font-family:Arial,sans-serif }
      .heading { font-size:23px; font-weight:bold } .label { font-size:19px; font-weight:bold }
      .small { font-size:15px } .note { fill:#CBD5E1; font-size:14px }
    </style>
  </defs>
  <rect class="bg" width="1200" height="1040" rx="14"/>
  <text class="heading" x="35" y="40">PROPOSAL · Azure production target</text>
  <text class="note" x="35" y="65">Not implemented · private tiers and zone redundancy require application changes</text>
  <rect class="node" x="40" y="100" width="240" height="80" rx="14"/>
  <text class="label" x="160" y="136" text-anchor="middle">Browser users</text>
  <text class="small" x="160" y="158" text-anchor="middle">HTTPS</text>
  <rect class="boundary" x="35" y="205" width="1130" height="615" rx="18"/>
  <text class="heading" x="60" y="238">Azure virtual network</text>
  <rect class="tier" x="60" y="255" width="1080" height="140" rx="14"/>
  <text class="label" x="80" y="283">Dedicated gateway subnet · public / DMZ edge</text>
  <rect class="node" x="650" y="295" width="380" height="80" rx="12"/>
  <image x="665" y="305" width="60" height="60" xlink:href="data:image/svg+xml;base64,"/>
  <text class="label" x="740" y="329">Application Gateway + WAF</text>
  <text class="small" x="740" y="351">TLS · hostname routing</text>
  <path class="line" d="M280 140 H620 V330 H648"/>
  <rect class="tier" x="60" y="420" width="1080" height="185" rx="14"/>
  <image x="80" y="432" width="42" height="42" xlink:href="data:image/svg+xml;base64,"/>
  <text class="label" x="135" y="448">Internal Azure Container Apps environment</text>
  <text class="note" x="135" y="471">Dedicated VNet subnet · scaling requires safe state and ingestion</text>
  <rect class="node" x="155" y="500" width="360" height="80" rx="12"/>
  <text class="label" x="335" y="534" text-anchor="middle">Building configurator</text>
  <text class="small" x="335" y="556" text-anchor="middle">Device integration required</text>
  <rect class="node" x="680" y="500" width="360" height="80" rx="12"/>
  <text class="label" x="860" y="534" text-anchor="middle">Instrumentation</text>
  <text class="small" x="860" y="556" text-anchor="middle">Coordinated telemetry ingestion</text>
  <path class="line" d="M780 375 V485 H335 V498"/>
  <path class="line" d="M900 375 V498"/>
  <path class="line dash" d="M680 540 H518"/>
  <text class="note" x="598" y="529" text-anchor="middle">private polling</text>
  <rect class="tier" x="60" y="630" width="1080" height="150" rx="14"/>
  <text class="label" x="80" y="658">Private delegated database subnet</text>
  <rect class="node" x="370" y="680" width="460" height="80" rx="12"/>
  <image x="385" y="690" width="60" height="60" xlink:href="data:image/svg+xml;base64,"/>
  <text class="label" x="460" y="714">Azure Database for PostgreSQL</text>
  <text class="small" x="460" y="736">Flexible Server · private access</text>
  <path class="line" d="M335 580 V710 H368"/>
  <path class="line" d="M860 580 V710 H832"/>
  <rect class="node" x="160" y="885" width="300" height="80" rx="12"/>
  <text class="label" x="310" y="919" text-anchor="middle">Physical IoT devices</text>
  <text class="small" x="310" y="941" text-anchor="middle">Device identities and TLS</text>
  <rect class="node" x="650" y="885" width="350" height="80" rx="12"/>
  <image x="665" y="895" width="60" height="60" xlink:href="data:image/svg+xml;base64,"/>
  <text class="label" x="740" y="919">Azure IoT Hub</text>
  <text class="small" x="740" y="941">Managed device boundary</text>
  <path class="line" d="M460 912 H648"/>
  <path class="line" d="M650 940 H462"/>
  <text class="note" x="520" y="881" text-anchor="middle">telemetry / possible commands</text>
  <path class="line" d="M155 525 H20 V865 H630 V900 H648"/>
  <path class="line" d="M650 950 H620 V980 H10 V550 H153"/>
  <text class="note" x="60" y="1010">Private DNS, outbound routes, secrets, logging and certificate management omitted.</text>
</svg>
