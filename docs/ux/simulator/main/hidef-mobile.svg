<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1860" viewBox="0 0 390 1860" role="img" aria-labelledby="title desc">
  <title id="title">Building Light Simulator mobile high-fidelity design</title>
  <desc id="desc">Illustrative narrow-screen design showing Floor 2 selected, a boardroom sensor fault, the building status table and accessible controls.</desc>
  <rect width="390" height="1860" fill="#101827"/>
  <g font-family="Arial, sans-serif">
    <g fill="#e8eefb">
      <text x="16" y="35" font-size="23" font-weight="bold">Building Light Simulator</text>
      <text x="16" y="58" font-size="13" fill="#a8b8d1">Four-floor controller simulation</text>
      <text x="16" y="80" font-size="12" fill="#a8b8d1">Choose a floor; select it again to reset the camera.</text>
      <text x="16" y="104" font-size="12" fill="#fda4af">MQTT unavailable · HTTP active</text>
    </g>
    <rect y="120" width="390" height="287" fill="#172238"/>
    <text x="14" y="146" fill="#fff" font-size="14" font-weight="bold">Building</text>
    <g fill="#1e293b" stroke="#43536a">
      <rect x="14" y="158" width="116" height="64" rx="5"/><rect x="137" y="158" width="116" height="64" rx="5"/><rect x="260" y="158" width="116" height="64" rx="5"/>
      <rect x="137" y="230" width="116" height="64" rx="5"/>
      <rect x="14" y="345" width="176" height="38" rx="5"/><rect x="200" y="345" width="176" height="38" rx="5"/>
    </g>
    <rect x="14" y="230" width="116" height="64" rx="5" fill="#2352cc" stroke="#8bb4ff"/>
    <g fill="#f2f6ff" font-size="12">
      <text x="23" y="183">All floors</text><text x="146" y="178">Floor 4</text><text x="269" y="178">Floor 3</text><text x="23" y="250">Floor 2</text><text x="146" y="250">Floor 1</text>
      <text x="146" y="195" font-size="10">Healthy</text><text x="269" y="195" font-size="10">Healthy</text><text x="23" y="267" font-size="10">⚠ Faulted</text><text x="146" y="267" font-size="10">Healthy</text>
      <text x="146" y="211" font-size="10">0/1 rooms occupied</text><text x="269" y="211" font-size="10">0/3 rooms occupied</text><text x="23" y="283" font-size="10">0/2 rooms occupied</text><text x="146" y="283" font-size="10">1/3 rooms occupied</text>
      <text x="14" y="326" font-size="13" font-weight="bold">Scenarios</text><text x="55" y="369">Reset building</text><text x="241" y="369">Occupancy demo</text>
    </g>
    <g fill="#dbe6f8" font-size="12">
      <text x="14" y="435">Tap a room to select · drag to orbit ·</text>
      <text x="14" y="453">two-finger pan and zoom</text>
      <text x="14" y="471">Stairs are at the back; orbit to view them.</text>
      <text x="14" y="489">Wiring: <tspan fill="#52caff">blue = sensors</tspan> · <tspan fill="#ffd055">yellow = lights</tspan></text>
    </g>
    <g stroke-linejoin="round">
      <path d="M37 652L194 571 357 636 204 724Z" fill="#33455e" stroke="#5d708c" stroke-width="3"/>
      <path d="M51 638L195 574 326 622 184 691Z" fill="#435b7a" stroke="#8091ae" stroke-width="3"/>
      <path d="M51 638V682L184 735V691Z" fill="#269bd1" stroke="#5ec8f4" stroke-width="2"/>
      <path d="M184 691V735L270 694V651Z" fill="#218ac0" stroke="#5ec8f4" stroke-width="2"/>
      <path d="M270 651V694L327 667V622Z" fill="#7c8eaa" stroke="#a9b8cb" stroke-width="2"/>
      <path d="M51 638L195 574 266 600 125 668Z" fill="#2c83b6" opacity=".8"/>
      <path d="M90 627L193 582 312 625M120 642L219 596M150 654L248 607M178 666L277 617" fill="none" stroke="#ffce3c" stroke-width="3"/>
      <path d="M195 576V610L168 622" fill="none" stroke="#45cbff" stroke-width="3"/>
      <circle cx="168" cy="622" r="6" fill="#ef4444"/>
      <path d="M91 660L152 684V697L91 673Z" fill="#101827"/><path d="M269 654L314 632V645L269 667Z" fill="#101827"/>
    </g>
    <text x="100" y="674" font-size="8" fill="#fff">BOARDROOM</text><text x="271" y="652" font-size="7" fill="#fff">MEETING OFFICE</text>
    <rect x="14" y="798" width="362" height="122" rx="7" fill="#111c30" stroke="#51627d"/>
    <text x="26" y="825" font-size="14" font-weight="bold" fill="#eff6ff">Floor 2 — Boardroom</text><text x="350" y="825" fill="#dbe6f8">×</text>
    <path d="M14 839H376M195 839V920" stroke="#34445a"/>
    <g fill="#d5e0f0" font-size="12"><text x="71" y="861">Presence</text><text x="249" y="861">Sensor fault</text></g>
    <rect x="94" y="874" width="20" height="20" rx="2" fill="#fff"/><rect x="267" y="874" width="20" height="20" rx="2" fill="#ef4444"/><text x="270" y="890" fill="#fff" font-size="16">✓</text>
    <rect y="1030" width="390" height="830" fill="#172238"/>
    <text x="14" y="1062" font-size="19" font-weight="bold" fill="#fff">Live status</text>
    <g fill="#dce6f6" font-size="11">
      <text x="16" y="1098" font-weight="bold">Controller</text><text x="145" y="1098" font-weight="bold">Floor</text><text x="191" y="1098" font-weight="bold">Status</text><text x="260" y="1098" font-weight="bold">Rooms / lights</text>
      <text x="16" y="1129">controller-floor-1</text><text x="145" y="1129">1</text><text x="191" y="1129">Healthy</text><text x="260" y="1129">6/8 on</text>
      <text x="16" y="1164">controller-floor-2</text><text x="145" y="1164">2</text><text x="191" y="1164">Faulted</text><text x="260" y="1164">0/9 on</text>
      <text x="16" y="1199">controller-floor-3</text><text x="145" y="1199">3</text><text x="191" y="1199">Healthy</text><text x="260" y="1199">0/8 on</text>
      <text x="16" y="1234">controller-floor-4</text><text x="145" y="1234">4</text><text x="191" y="1234">Healthy</text><text x="260" y="1234">0/12 on</text>
    </g>
    <g stroke="#3b4b62"><path d="M14 1109H376M14 1144H376M14 1179H376M14 1214H376M14 1249H376"/></g>
    <text x="14" y="1285" font-size="14" font-weight="bold" fill="#fff">▾ Accessible controls</text>
    <g fill="#dce6f6" font-size="12"><text x="14" y="1315">Floor view</text><text x="14" y="1392">Room sensor</text><text x="14" y="1513">Fault type</text><text x="14" y="1674">controller-floor-2: sensor — Simulated sensor fault</text></g>
    <g fill="#1e293b" stroke="#43536a"><rect x="14" y="1325" width="362" height="40" rx="4"/><rect x="14" y="1402" width="362" height="40" rx="4"/><rect x="14" y="1523" width="362" height="40" rx="4"/><rect x="14" y="1570" width="362" height="40" rx="4"/></g>
    <g fill="#fff" font-size="12"><text x="25" y="1350">Floor 2</text><text x="25" y="1427">controller-floor-1 — Open Workspace</text><text x="25" y="1548">Sensor</text><text x="25" y="1595">Floor 1 — Open Workspace sensor</text></g>
    <rect x="14" y="1450" width="210" height="37" rx="4" fill="#2563eb"/><text x="25" y="1474" fill="#fff" font-size="12">Trigger selected room sensor</text>
    <rect x="14" y="1618" width="155" height="37" rx="4" fill="#2563eb"/><text x="25" y="1642" fill="#fff" font-size="12">Inject selected fault</text>
    <rect x="14" y="1690" width="65" height="37" rx="4" fill="#b45309"/><text x="31" y="1714" fill="#fff" font-size="12">Clear</text>
  </g>
</svg>
