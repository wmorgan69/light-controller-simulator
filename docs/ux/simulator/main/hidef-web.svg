      <rect x="928" y="309" width="70" height="12" rx="3" fill="#0b1220"/>
      <text x="963" y="318" font-size="7.5" fill="#f8fafc" text-anchor="middle">FOCUS OFFICE</text>
      <!-- Floor 2 -->
      <path d="M630 420 840 358 1050 420 840 482Z" fill="#33455e" stroke="#5d708c" stroke-width="2"/>
      <path d="M630 420v20l210 62v-20Z" fill="#223049" stroke="#3b4e6b"/>
      <path d="M840 482v20l210-62v-20Z" fill="#2a3a57" stroke="#3b4e6b"/>
      <path d="M706 418 846 376 972 412 832 455Z" fill="#3d5273" stroke="#7c90ad" stroke-width="1.5"/>
      <rect x="800" y="408" width="80" height="13" rx="3" fill="#0b1220"/>
      <text x="840" y="417.5" font-size="8" fill="#f8fafc" text-anchor="middle">BOARDROOM</text>
      <!-- Floor 1 (occupied, lights on) -->
      <path d="M630 510 840 448 1050 510 840 572Z" fill="#33455e" stroke="#5d708c" stroke-width="2"/>
      <path d="M630 510v20l210 62v-20Z" fill="#223049" stroke="#3b4e6b"/>
      <path d="M840 572v20l210-62v-20Z" fill="#2a3a57" stroke="#3b4e6b"/>
      <path d="M700 506 826 468 920 496 794 535Z" fill="#6b5d3f" stroke="#fcd34d" stroke-width="1.5"/>
      <circle cx="812" cy="500" r="5" fill="#4ade80"/>
      <rect x="752" y="494" width="104" height="13" rx="3" fill="#0b1220"/>
      <text x="804" y="503.5" font-size="8" fill="#f8fafc" text-anchor="middle">OPEN WORKSPACE</text>
