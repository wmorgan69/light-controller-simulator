    <text x="1288" y="36" font-size="13" fill="#bfdbfe" text-anchor="middle">Building ▾</text>
    <circle cx="1372" cy="25" r="2.2" fill="#cbd5e1"/>
    <circle cx="1372" cy="32" r="2.2" fill="#cbd5e1"/>
    <circle cx="1372" cy="39" r="2.2" fill="#cbd5e1"/>
    <!-- Navigation drawer -->
    <rect x="0" y="65" width="280" height="835" fill="#172033"/>
