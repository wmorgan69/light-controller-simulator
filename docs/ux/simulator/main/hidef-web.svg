<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Building Light Simulator modernized desktop design target</title>
  <desc id="desc">Illustrative desktop design target with a Material app bar holding status chips and the Building menu, a permanent navigation drawer with floor list and scenarios, a rounded 3D scene card with a floating room inspector, and a live status card. It is a design target, not a browser capture.</desc>
