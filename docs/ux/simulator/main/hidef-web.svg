    <radialGradient id="scene" cx="50%" cy="42%" r="78%">
      <stop offset="0%" stop-color="#273449"/>
      <stop offset="100%" stop-color="#0d1320"/>
    </radialGradient>
  </defs>
  <rect width="1400" height="900" fill="#111827"/>
  <g font-family="Arial, sans-serif">
    <!-- App bar -->
    <rect width="1400" height="64" fill="#0f172a"/>
    <line x1="0" y1="64.5" x2="1400" y2="64.5" stroke="#334155"/>
