      <circle cx="766" cy="792" r="4" fill="#4ade80"/><text x="778" y="796" fill="#86efac">Healthy</text>
      <circle cx="766" cy="824" r="4" fill="#fbbf24"/><text x="778" y="828" fill="#fbbf24">⚠ Faulted</text>
