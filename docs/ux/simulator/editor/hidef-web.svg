    <text x="1134" y="353" fill="#cbd5e1" font-size="13">Name</text>
    <rect x="1134" y="365" width="268" height="44" rx="8" fill="#0f172a" stroke="#475569"/><text x="1148" y="392" fill="#e2e8f0" font-size="13">Collaboration Space</text>
    <text x="1134" y="450" fill="#cbd5e1" font-size="13">Position and size (m)</text>
    <g fill="#0f172a" stroke="#475569"><rect x="1134" y="464" width="126" height="44" rx="8"/><rect x="1276" y="464" width="126" height="44" rx="8"/><rect x="1134" y="522" width="126" height="44" rx="8"/><rect x="1276" y="522" width="126" height="44" rx="8"/></g>
    <g fill="#e2e8f0" font-size="13"><text x="1148" y="491">X   2</text><text x="1290" y="491">Z   2</text><text x="1148" y="549">Width   11</text><text x="1290" y="549">Depth   9</text></g>
    <rect x="1134" y="592" width="268" height="44" rx="22" fill="#2563eb"/><text x="1268" y="619" text-anchor="middle" fill="#fff" font-size="14">Apply changes</text>
    <text x="1134" y="691" fill="#94a3b8" font-size="12">Saved and running revisions,</text><text x="1134" y="710" fill="#94a3b8" font-size="12">activation and cleanup remain visible.</text>
  </g>
</svg>
