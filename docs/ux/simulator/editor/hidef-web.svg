    <path d="M25 25h20M25 34h20M25 43h20" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
    <text x="64" y="41" fill="#f8fafc" font-size="19" font-weight="bold">Building editor</text>
    <text x="270" y="41" fill="#94a3b8" font-size="14">Floor 3</text>
    <rect x="861" y="16" width="155" height="36" rx="18" fill="#3a2a12"/>
