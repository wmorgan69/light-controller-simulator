    <circle cx="570" cy="394" r="10" fill="#38bdf8"/><rect x="590" y="628" width="46" height="14" fill="#f8fafc"/>
    <path d="M714 704L570 394" fill="none" stroke="#7dd3fc" stroke-width="2" stroke-dasharray="6 5"/><path d="M714 704L535 525" fill="none" stroke="#fcd34d" stroke-width="2" stroke-dasharray="6 5"/><rect x="704" y="694" width="20" height="20" rx="4" fill="#f472b6"/>
    <text x="298" y="820" fill="#cbd5e1" font-size="12">Logical connections only  ·  Blue: sensor  ·  Yellow: light</text>
