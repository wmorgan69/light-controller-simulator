<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">Building editor desktop modernization concept</title>
  <desc id="description">Proposed dark desktop editor with a top action bar, floor navigation, an icon toolbar, a selected room on the plan and an item list and properties panel. This is not a screenshot of the current application.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#334155" stroke-width="1"/></pattern>
  </defs>
  <rect width="1440" height="900" fill="#111827"/>
  <g font-family="Arial, sans-serif">
