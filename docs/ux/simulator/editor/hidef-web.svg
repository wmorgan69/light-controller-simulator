    <rect x="1028" y="12" width="44" height="44" rx="10" fill="#1e293b"/><text x="1050" y="41" text-anchor="middle" fill="#e2e8f0" font-size="24">↶</text>
    <rect x="1080" y="12" width="44" height="44" rx="10" fill="#1e293b"/><text x="1102" y="41" text-anchor="middle" fill="#e2e8f0" font-size="24">↷</text>
    <rect x="1136" y="12" width="84" height="44" rx="22" fill="#2563eb"/><text x="1178" y="40" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">Save</text>
    <rect x="1230" y="12" width="92" height="44" rx="22" fill="#1e293b" stroke="#475569"/><text x="1276" y="40" text-anchor="middle" fill="#bfdbfe" font-size="14">Export</text>
    <rect x="1332" y="12" width="84" height="44" rx="22" fill="#1e293b" stroke="#475569"/><text x="1374" y="40" text-anchor="middle" fill="#bfdbfe" font-size="14">Exit</text>
    <rect x="16" y="84" width="226" height="800" rx="16" fill="#172033"/>
    <text x="36" y="120" fill="#f8fafc" font-size="17" font-weight="bold">Building</text>
    <text x="36" y="155" fill="#cbd5e1" font-size="13">Dimensions</text>
    <rect x="36" y="167" width="86" height="44" rx="8" fill="#0f172a" stroke="#475569"/><text x="48" y="194" fill="#e2e8f0" font-size="13">20 m</text>
    <rect x="132" y="167" width="86" height="44" rx="8" fill="#0f172a" stroke="#475569"/><text x="144" y="194" fill="#e2e8f0" font-size="13">20 m</text>
    <text x="36" y="249" fill="#f8fafc" font-size="15" font-weight="bold">Floors</text>
    <text x="48" y="291" fill="#cbd5e1" font-size="14">Floor 4</text>
    <rect x="28" y="306" width="202" height="48" rx="10" fill="#1d4ed8"/><text x="48" y="336" fill="#fff" font-size="14" font-weight="bold">Floor 3</text>
    <text x="48" y="392" fill="#cbd5e1" font-size="14">Floor 2</text><text x="48" y="448" fill="#cbd5e1" font-size="14">Floor 1</text>
    <text x="36" y="530" fill="#94a3b8" font-size="13">Building settings and floor</text><text x="36" y="551" fill="#94a3b8" font-size="13">selection remain available.</text>
    <rect x="258" y="84" width="838" height="72" rx="16" fill="#172033"/>
    <text x="278" y="125" fill="#f8fafc" font-size="14" font-weight="bold">Tools</text>
