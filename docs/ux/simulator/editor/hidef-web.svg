      <rect x="342" y="98" width="100" height="44" rx="10" fill="#1d4ed8"/><text x="358" y="125">↖  Select</text>
      <text x="463" y="125">✥  Move</text><text x="558" y="125">▣  Room</text><text x="654" y="125">▱  Door</text><text x="747" y="125">☼  Light</text>
    </g>
