    <rect x="792" y="308" width="236" height="156" rx="4" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
    <text x="810" y="341" fill="#f8fafc" font-size="14">Project Office</text>
    <rect x="792" y="486" width="236" height="156" rx="4" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
    <text x="810" y="519" fill="#f8fafc" font-size="14">Focus Office</text>
