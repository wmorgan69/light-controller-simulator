<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1120" viewBox="0 0 390 1120" role="img" aria-labelledby="title desc">
  <title id="title">Proposed building editor mobile wireframe</title>
  <desc id="desc">A narrow stacked layout with a header, floor controls, wrapping toolbar, floor plan, item list, and properties.</desc>
  <rect width="390" height="1120" fill="#f3f4f6"/>
  <g fill="#fff" stroke="#334155" stroke-width="2">
    <rect x="12" y="12" width="366" height="106" rx="4"/>
    <rect x="12" y="130" width="366" height="116" rx="4"/>
    <rect x="12" y="258" width="366" height="120" rx="4"/>
    <rect x="12" y="390" width="366" height="260" rx="4"/>
    <rect x="12" y="662" width="366" height="125" rx="4"/>
    <rect x="12" y="799" width="366" height="200" rx="4"/>
    <rect x="286" y="63" width="76" height="44" rx="4"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#172033">
    <text x="28" y="44" font-size="18" font-weight="bold">Menu  |  Edit building</text>
    <text x="28" y="90" font-size="15">Unsaved changes</text>
    <text x="305" y="90" font-size="15">Save</text>
    <text x="28" y="161" font-size="18" font-weight="bold">Building</text>
    <text x="28" y="193" font-size="15">Floor count</text>
    <text x="28" y="224" font-size="15">Floor 2 - selected</text>
    <text x="28" y="289" font-size="18" font-weight="bold">Tools</text>
    <text x="28" y="323" font-size="15">Select  |  Room  |  Door</text>
    <text x="28" y="354" font-size="15">Light  |  Connect</text>
    <text x="28" y="421" font-size="18" font-weight="bold">Floor plan</text>
    <text x="28" y="446" font-size="14">Selected: Office A</text>
    <text x="28" y="693" font-size="18" font-weight="bold">Items and connections</text>
    <text x="28" y="722" font-size="15">Office A</text>
    <text x="28" y="750" font-size="15">Light 1 - Controller 2</text>
    <text x="28" y="830" font-size="18" font-weight="bold">Properties: Office A</text>
    <text x="28" y="861" font-size="15">Name</text>
    <text x="28" y="930" font-size="15">Position and size</text>
