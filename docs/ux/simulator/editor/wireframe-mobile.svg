    <text x="12" y="1055" font-size="14">Controls: at least 44 x 44 CSS px</text>
    <text x="12" y="1081" font-size="13">Schematic only; content continues below the fold.</text>
  </g>
  <g fill="none" stroke="#64748b" stroke-width="2">
    <rect x="48" y="478" width="135" height="130"/>
    <rect x="183" y="478" width="135" height="130"/>
    <rect x="28" y="872" width="334" height="42" rx="3"/>
    <rect x="28" y="941" width="160" height="42" rx="3"/>
    <rect x="202" y="941" width="160" height="42" rx="3"/>
    <circle cx="100" cy="548" r="8"/>
    <path d="M100 548 L250 548"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#334155" font-size="13">
    <text x="58" y="503">Office A</text>
    <text x="195" y="503">Room</text>
    <text x="215" y="572">Controller</text>
