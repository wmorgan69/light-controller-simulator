<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc">
  <title id="title">Simulator desktop wireframe</title>
  <desc id="desc">Desktop layout with floor navigation beside a selected-floor view, followed by live status and accessible controls.</desc>
  <rect width="1200" height="960" fill="#fff"/>
  <g fill="none" stroke="#333" stroke-width="2">
    <path d="M0 104H1200M230 104V560M0 560H1200"/>
    <rect x="16" y="146" width="198" height="38"/><rect x="16" y="194" width="198" height="48"/><rect x="16" y="250" width="198" height="48"/><rect x="16" y="306" width="198" height="48"/><rect x="16" y="362" width="198" height="48"/>
    <rect x="16" y="452" width="198" height="34"/><rect x="16" y="494" width="198" height="34"/>
    <rect x="260" y="168" width="910" height="245" stroke-dasharray="8 5"/><rect x="260" y="426" width="310" height="104"/>
    <rect x="16" y="612" width="1168" height="152"/><path d="M16 642H1184M16 672H1184M16 702H1184M16 732H1184"/>
