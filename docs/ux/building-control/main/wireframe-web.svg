    <text x="16" y="132" font-weight="bold">Building</text><text x="28" y="171">All floors</text><text x="28" y="224">Floor 4 · status · occupancy</text><text x="28" y="280">Floor 3 · status · occupancy</text><text x="28" y="336">Floor 2 · selected</text><text x="28" y="392">Floor 1 · status · occupancy</text>
    <text x="16" y="440" font-weight="bold">Scenarios</text><text x="28" y="475">Reset building</text><text x="28" y="517">Occupancy demo</text>
    <text x="260" y="132">Room selection and camera help · Wiring legend</text><text x="590" y="292">3D selected floor</text><text x="276" y="452" font-weight="bold">Floor 2 — Boardroom</text><text x="276" y="486">Presence [ ]</text><text x="415" y="486">Sensor fault [x]</text><text x="276" y="514">Room controls</text>
