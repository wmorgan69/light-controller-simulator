<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1170" viewBox="0 0 1200 1170" role="img" aria-labelledby="title desc">
  <title id="title">Lighting Instrumentation dimensioned layouts</title>
  <desc id="desc">Schematic desktop, tablet and mobile dashboard layouts with width, gap, card and breakpoint dimensions from the instrumentation stylesheet. Not to scale.</desc>
  <rect width="1200" height="1170" fill="#f7f9fc"/>
  <g font-family="Arial, sans-serif">
    <text x="32" y="40" fill="#12223a" font-size="26" font-weight="bold">Instrumentation layout dimensions</text>
    <text x="32" y="68" fill="#43556e" font-size="16">CSS dimensions · schematic, not to scale · 1rem depends on browser root size</text>
    <text x="32" y="110" fill="#12223a" font-size="20" font-weight="bold">Desktop: viewport &gt; 1050px</text>
    <rect x="32" y="125" width="1136" height="50" fill="#dbe6f5" stroke="#6882a5"/>
    <text x="48" y="155" fill="#152a45" font-size="16" font-weight="bold">Top bar: 66px high</text>
    <text x="32" y="202" fill="#344c69" font-size="14">Main width: min(1380px, 100% - 3rem) · centered</text><text x="800" y="202" fill="#152a45" font-size="15" font-weight="bold">Page heading + update status</text>
    <g fill="#fff" stroke="#8298b4"><rect x="32" y="218" width="270" height="78" rx="8"/><rect x="320" y="218" width="270" height="78" rx="8"/><rect x="608" y="218" width="270" height="78" rx="8"/><rect x="896" y="218" width="272" height="78" rx="8"/></g>
    <g fill="#152a45" font-size="15"><text x="46" y="249">Controllers online</text><text x="334" y="249">Active faults</text><text x="622" y="249">Lights on</text><text x="910" y="249">Occupied rooms</text></g>
    <text x="32" y="309" fill="#43556e" font-size="12">4 equal columns · 1rem gap · card minimum height 122px</text>
    <rect x="32" y="313" width="770" height="58" rx="8" fill="#e0eaf8" stroke="#6882a5"/>
    <text x="48" y="348" fill="#152a45" font-size="15" font-weight="bold">Lighting activity</text>
    <g fill="#fff" stroke="#8298b4"><rect x="32" y="383" width="376" height="83" rx="8"/><rect x="426" y="383" width="376" height="83" rx="8"/><rect x="32" y="478" width="376" height="83" rx="8"/><rect x="426" y="478" width="376" height="83" rx="8"/></g>
    <text x="48" y="417" fill="#152a45" font-size="15" font-weight="bold">Controller cards: 2 columns</text>
    <text x="48" y="444" fill="#344c69" font-size="14">grid gap: .85rem</text>
    <rect x="822" y="313" width="346" height="248" rx="8" fill="#fff" stroke="#8298b4"/>
    <text x="838" y="345" fill="#152a45" font-size="15" font-weight="bold">Recent events</text>
    <text x="838" y="370" fill="#344c69" font-size="14">column: 330px</text>
    <text x="838" y="393" fill="#344c69" font-size="14">list max-height: 740px</text>
    <text x="32" y="590" fill="#344c69" font-size="14">Dashboard: flexible primary column + 330px events column · gap: 1.25rem</text>

    <text x="32" y="640" fill="#12223a" font-size="20" font-weight="bold">Tablet: 761px–1050px</text>
    <rect x="32" y="654" width="535" height="45" fill="#dbe6f5" stroke="#6882a5"/><text x="48" y="682" fill="#152a45" font-size="15">Top bar: 66px high</text>
    <text x="48" y="722" fill="#152a45" font-size="15" font-weight="bold">Page heading + update status</text>
    <g transform="translate(0 35)">
    <rect x="32" y="709" width="535" height="56" rx="8" fill="#fff" stroke="#8298b4"/><path d="M166 709V765M300 709V765M434 709V765" stroke="#8298b4"/><text x="48" y="733" fill="#152a45" font-size="15">4 columns</text><text x="48" y="753" fill="#344c69" font-size="13">122px minimum</text>
    <rect x="32" y="777" width="310" height="215" rx="8" fill="#e0eaf8" stroke="#6882a5"/><text x="48" y="804" fill="#152a45" font-size="15" font-weight="bold">Lighting activity</text>
    <g fill="#fff" stroke="#8298b4"><rect x="48" y="818" width="278" height="47" rx="6"/><rect x="48" y="875" width="278" height="47" rx="6"/><rect x="48" y="932" width="278" height="47" rx="6"/></g>
    <text x="60" y="847" fill="#344c69" font-size="14">Controllers: 1 column</text>
    <rect x="354" y="777" width="213" height="215" rx="8" fill="#fff" stroke="#8298b4"/><text x="370" y="804" fill="#152a45" font-size="15" font-weight="bold">Recent events</text><text x="370" y="830" fill="#344c69" font-size="14">column: 290px</text><text x="370" y="853" fill="#344c69" font-size="14">gap: 1.25rem</text>
    <text x="32" y="1020" fill="#344c69" font-size="14">Main width: min(1380px, 100% - 3rem)</text>
    </g>

    <text x="620" y="640" fill="#12223a" font-size="20" font-weight="bold">Mobile: viewport ≤ 760px</text>
    <rect x="620" y="654" width="548" height="45" fill="#dbe6f5" stroke="#6882a5"/><text x="636" y="682" fill="#152a45" font-size="15">Top bar: 58px high</text>
    <text x="636" y="722" fill="#152a45" font-size="15" font-weight="bold">Page heading + update status</text>
    <g transform="translate(0 35)">
    <g fill="#fff" stroke="#8298b4"><rect x="620" y="709" width="264" height="50" rx="8"/><rect x="904" y="709" width="264" height="50" rx="8"/><rect x="620" y="769" width="264" height="50" rx="8"/><rect x="904" y="769" width="264" height="50" rx="8"/></g>
    <text x="636" y="739" fill="#152a45" font-size="15">Summary: 2 columns</text><text x="920" y="739" fill="#344c69" font-size="14">gap: .65rem</text><text x="636" y="800" fill="#344c69" font-size="14">card minimum height: 106px</text>
    <rect x="620" y="831" width="548" height="55" rx="8" fill="#e0eaf8" stroke="#6882a5"/><text x="636" y="864" fill="#152a45" font-size="15" font-weight="bold">Lighting activity</text>
    <rect x="620" y="896" width="548" height="55" rx="8" fill="#fff" stroke="#8298b4"/><text x="636" y="929" fill="#152a45" font-size="15" font-weight="bold">Controllers: 1 column</text>
    <rect x="620" y="961" width="548" height="55" rx="8" fill="#fff" stroke="#8298b4"/><text x="636" y="985" fill="#152a45" font-size="15" font-weight="bold">Recent events</text><text x="636" y="1005" fill="#344c69" font-size="13">list max-height: 400px</text>
    <text x="620" y="1044" fill="#344c69" font-size="14">Main width: min(100% - 2rem, 600px) · dashboard gap: 1.1rem</text>
    <text x="620" y="1067" fill="#344c69" font-size="14">At ≤ 420px, room information wraps above fixture markers.</text>
    </g>
    <text x="32" y="1144" fill="#43556e" font-size="14">Card boxes are schematic; text describes the implemented CSS dimensions and constraints.</text>
  </g>
</svg>
