services:
  simulator:
    build:
      context: .
      target: simulator
    command: ["--urls", "http://0.0.0.0:8080"]
    environment:
      BuildingDesign__SqlitePath: /data/building-design.db
      Simulator__AllowHttpMutations: "false"
    ports:
      - "127.0.0.1:5080:8080"
    volumes:
      - building-design-data:/data

  instrumentation:
    build:
      context: .
      target: instrumentation
    command: ["--urls", "http://0.0.0.0:8080"]
    environment:
      Telemetry__SimulatorBaseUrl: http://simulator:8080
      Telemetry__SqlitePath: /data/telemetry.db
    ports:
      - "127.0.0.1:5081:8080"
    volumes:
      - telemetry-data:/data
    depends_on:
      - simulator

volumes:
  telemetry-data:
  building-design-data:
