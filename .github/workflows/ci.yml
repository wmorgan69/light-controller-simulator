name: .NET validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check GitHub Actions workflows
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=

  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    outputs:
      coverage-artifact-id: ${{ steps.coverage-artifact.outputs.artifact-id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 11.0.x

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontends
        run: npm run lint

      - name: Test lint configuration
        run: npm run test:lint

      - name: Type-check frontends
        run: npm run typecheck

      - name: Build frontends
        run: |
          npm run build:simulator
          npm run build:instrumentation

      - name: Test frontend components
        run: npm run test:components

      - name: Restore
        run: dotnet restore Devices.slnx

      - name: Check .NET formatting
        run: dotnet format Devices.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Devices.slnx --no-restore

      - name: Test
        run: dotnet test Devices.slnx --no-build --no-restore --collect:"XPlat Code Coverage" --logger "trx"

      - name: Enforce code coverage >= 50%
        run: |
          # Collect coverage results
          coverage_files=$(find . -name "coverage.cobertura.xml" -type f)
          if [ -z "$coverage_files" ]; then
            echo "ERROR: No coverage files found. Build with --collect:'XPlat Code Coverage'"
            exit 1
          fi
          
          # Extract line coverage percentage from first coverage file
          line_coverage=$(grep -oP 'line-rate="\K[^"]+' $(echo "$coverage_files" | head -1) | head -1)
          line_coverage_pct=$(echo "scale=2; $line_coverage * 100" | bc)
          
          echo "Code Coverage: ${line_coverage_pct}%"
          
          # Phase 1: Enforce 50% threshold (baseline; can be raised to 60%, 75%, 90% over time)
          # See docs/contributing/quality-and-security.md for phased enforcement strategy
          if (( $(echo "$line_coverage_pct < 50" | bc -l) )); then
            echo "ERROR: Code coverage ${line_coverage_pct}% is below 50% threshold"
            exit 1
          fi
          echo "✓ Code coverage ${line_coverage_pct}% meets 50% threshold (Phase 1 of multi-phase approach)"
        shell: bash

      - name: Save coverage reports
        id: coverage-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: dotnet-coverage
          path: tests/**/TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

      - name: Test browser logic and localization
        run: node --import tsx --test tests/building-access.test.mjs tests/wiring-routes.test.mjs tests/floor-view.test.mjs tests/room-state.test.mjs tests/record-demo.test.mjs tests/localization-en.test.mjs tests/building-design-view.test.mjs tests/building-editor.test.mjs tests/building-editor-ui.test.mjs tests/simulator-react-model.test.mjs tests/instrumentation-localization.test.mjs tests/instrumentation-react-telemetry.test.mjs

      - name: Smoke test Docker Compose
        shell: bash
        run: |
          set -euo pipefail
          response_file=$(mktemp)
          cleanup() {
            rm -f "$response_file"
            docker compose logs
            docker compose down --volumes
          }
          trap cleanup EXIT
          docker compose up --build -d
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-max-time 30 --max-time 5 --retry-all-errors --output "$response_file" http://localhost:5080/api/controllers
          jq -e 'length == 4' "$response_file"
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-max-time 30 --max-time 5 --retry-all-errors --output /dev/null http://localhost:5081/api/status
          mutation_status=$(curl --silent --show-error --max-time 5 --output "$response_file" --write-out '%{http_code}' -X POST http://localhost:5080/api/rooms/floor-1-main/sensor/trigger)
          if [ "$mutation_status" != 403 ]; then
            echo "Expected HTTP 403 for disabled simulator mutation, got $mutation_status"
            exit 1
          fi
          observed=false
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 5 http://localhost:5081/api/status | jq -e '.httpAvailable == true and .mqttConnected == false and .simulatorHttpSource == "http://simulator:8080"' > /dev/null &&
              curl --fail --silent --max-time 5 http://localhost:5081/api/telemetry/controller-floor-1 | jq -e '.id == "controller-floor-1" and any(.rooms[]; .id == "floor-1-main" and .presence == false)' > /dev/null; then
              observed=true
              break
            fi
            sleep 1
          done
          test "$observed" = true
          docker compose stop instrumentation simulator
          docker compose up -d --no-deps --force-recreate instrumentation
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-max-time 30 --max-time 5 --retry-all-errors --output "$response_file" http://localhost:5081/api/telemetry/controller-floor-1
          jq -e '.id == "controller-floor-1" and any(.rooms[]; .id == "floor-1-main" and .presence == false)' "$response_file"

  coverage-upload:
    name: Upload coverage
    needs: build-test
    if: ${{ !cancelled() && needs.build-test.result == 'success' && needs.build-test.outputs.coverage-artifact-id != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download coverage reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dotnet-coverage
          path: coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          directory: coverage
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.CODECOV_TOKEN || '' }}
